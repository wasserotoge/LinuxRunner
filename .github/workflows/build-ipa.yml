name: Build unsigned IPA

# Builds the LinuxRunner scheme on a GitHub-hosted Mac and uploads an
# unsigned (ad-hoc signed) IPA for sideloading tools that re-sign it.
#   full  = LINUXRUNNER_JIT=YES LINUXRUNNER_VIRGL=YES (the official release variant)
#   basic = interpreter/software variant
# The GPU dependencies (ANGLE, virglrenderer, libepoxy) are built from the
# revisions recorded in docs/BUILDING.md and cached between runs.

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      variant:
        description: full = JIT + Metal GPU (official release variant), basic = interpreter only
        type: choice
        options:
          - full
          - basic
        default: full

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned IPA (${{ inputs.variant || 'full' }})
    # Xcode 27.2 / iPhoneOS SDK 27.2, as recorded for the official build 900
    # archive; the app uses iOS 27 APIs, so an Xcode 26 image cannot build it.
    runs-on: xcode-27
    timeout-minutes: 330
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      LINUXRUNNER_JIT: ${{ (inputs.variant || 'full') == 'full' && 'YES' || 'NO' }}
      LINUXRUNNER_VIRGL: ${{ (inputs.variant || 'full') == 'full' && 'YES' || 'NO' }}
      # GPU dependency revisions recorded in docs/BUILDING.md.
      REV_DEPOT_TOOLS: a20039648c0de69d8156906b18052bd47e9bf230
      REV_VIRGLRENDERER: e0a1caf3b147bb26dfe524dbb85ded1177e7e49e
      REV_LIBEPOXY: d1f952c4565c389d82fd1657153e84e050f35b27
      REV_ANGLE: feebf60fe088ccec3a26a7419d6ac68edf542c7a
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Initialize pinned submodules
        # deps/linux is not used by the app and is skipped on purpose.
        run: >
          git submodule update --init --recursive --checkout --
          deps/libapps deps/libarchive deps/glslang deps/spirv-cross

      - name: Install Meson and LLD
        run: |
          brew install meson lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          meson --version
          ld.lld --version
          cmake --version | head -n 1
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Check prerequisites
        run: scripts/bootstrap-macos.sh

      - name: Restore GPU dependencies
        id: gpu-cache
        if: env.LINUXRUNNER_VIRGL == 'YES'
        uses: actions/cache/restore@v6
        with:
          path: build/gpu/iphoneos
          key: gpu-iphoneos-xcode27.2-${{ env.REV_ANGLE }}-${{ env.REV_VIRGLRENDERER }}-${{ env.REV_LIBEPOXY }}-${{ hashFiles('scripts/build-gpu-deps.sh', 'scripts/gpu/**') }}

      - name: Fetch GPU dependency sources
        if: env.LINUXRUNNER_VIRGL == 'YES' && steps.gpu-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          GPU_DEPS="$RUNNER_TEMP/gpu-deps"
          echo "GPU_DEPS=$GPU_DEPS" >> "$GITHUB_ENV"
          mkdir -p "$GPU_DEPS"
          fetch_rev() {
            local dir="$GPU_DEPS/$1" url=$2 rev=$3
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch -q --depth 1 origin "$rev" || git -C "$dir" fetch -q origin
            git -C "$dir" checkout -q --detach "$rev"
            echo "$1 $(git -C "$dir" rev-parse HEAD)"
          }
          fetch_rev depot_tools https://chromium.googlesource.com/chromium/tools/depot_tools.git "$REV_DEPOT_TOOLS"
          fetch_rev virglrenderer https://gitlab.freedesktop.org/virgl/virglrenderer.git "$REV_VIRGLRENDERER"
          fetch_rev libepoxy https://github.com/anholt/libepoxy.git "$REV_LIBEPOXY"
          fetch_rev angle https://chromium.googlesource.com/angle/angle "$REV_ANGLE"
          # Keep depot_tools at the recorded revision instead of self-updating.
          export PATH="$GPU_DEPS/depot_tools:$PATH" DEPOT_TOOLS_UPDATE=0
          cd "$GPU_DEPS/angle"
          python3 scripts/bootstrap.py
          gclient sync --no-history --shallow --jobs 8
          df -h "$RUNNER_TEMP"

      - name: Build GPU dependencies
        if: env.LINUXRUNNER_VIRGL == 'YES' && steps.gpu-cache.outputs.cache-hit != 'true'
        run: |
          scripts/build-gpu-deps.sh iphoneos
          cat build/gpu/iphoneos/REVISIONS
          # Only lib/ and include/ are linked by the app; drop the build trees.
          rm -rf build/gpu/iphoneos/work

      - name: Save GPU dependencies
        if: env.LINUXRUNNER_VIRGL == 'YES' && steps.gpu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/gpu/iphoneos
          key: ${{ steps.gpu-cache.outputs.cache-primary-key }}

      - name: Build unsigned IPA
        run: scripts/build-ipa.sh --unsigned

      - name: Verify IPA
        run: python3 scripts/verify-ipa.py build/releases

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: LinuxRunner-unsigned-${{ inputs.variant || 'full' }}-${{ github.sha }}
          path: |
            build/releases/LinuxRunner.ipa
            build/releases/LinuxRunner.ipa.sha256
            build/releases/LinuxRunner.validation.json
            build/releases/SIGNING-STATUS.txt
            build/releases/source-revision.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.sha }}
          path: build/releases/archive.log
          if-no-files-found: ignore
          retention-days: 7
